name: Topic 1 Linux reproduction

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Minimum teacher requirements or full optimized experiment'
        type: choice
        options:
          - minimum
          - all
        default: minimum
        required: true

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked environment from scratch
        run: python3.12 scripts/reproduce_topic1.py setup
      - name: Unit and integrity regression tests
        run: bash topic1/python.sh scripts/reproduce_topic1.py test
      - name: Record numerical runtime
        run: |
          bash topic1/python.sh - <<'PY'
          import json, platform
          from pathlib import Path
          import numpy, scipy, sklearn
          from threadpoolctl import threadpool_info
          Path('reproduction-runtime.json').write_text(json.dumps({
              'platform': platform.platform(), 'machine': platform.machine(),
              'python': platform.python_version(), 'threadpools': threadpool_info(),
          }, indent=2))
          PY
      - name: Run official folds and scientific audits
        env:
          REPRO_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          bash topic1/python.sh scripts/reproduce_topic1.py "$REPRO_SCOPE" 2>&1 | tee reproduction-linux.log
      - name: Save evidence and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: topic1-linux-${{ inputs.scope }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            reproduction-linux.log
            reproduction-runtime.json
            outputs/**/environment.json
            outputs/**/features*.npy
            outputs/**/samples.csv
            outputs/**/official_folds.json
            outputs/**/runs/**/*.csv
            outputs/**/requirement_audit.json
            outputs/**/delivery_manifest.json
            outputs/**/protocol.json
            outputs/**/summary.csv
            outputs/**/validation_summary.csv
            outputs/**/fold_metrics.csv
            outputs/**/REPORT.md

